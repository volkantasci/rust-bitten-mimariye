[package]
name = "ayarlar"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1"

# Boyut için ayarlanmış ikinci bir profil
[profile.kucuk]
inherits = "release"
opt-level = "z"     # boyut için optimize et
lto = "fat"         # tüm crate'leri birlikte optimize et (bağlama zamanında)
codegen-units = 1   # tek kod üretim birimi: daha çok optimizasyon fırsatı
panic = "abort"     # yığın geri sarma (unwinding) kodu ve tabloları yok
strip = true        # sembolleri at

# Aynı "kucuk" profil, tek fark: sembol tablosu kalıyor, yalnız hata ayıklama bilgisi atılıyor
# (strip = true'nun boyuta katkısını ayırmak için)
[profile.kucuk-semboller]
inherits = "kucuk"
strip = "debuginfo"

[profile.hizli]
inherits = "release"
lto = "fat"
codegen-units = 1
